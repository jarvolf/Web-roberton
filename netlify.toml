[build]
  base      = "/"
  command   = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/borcovna... run build"
  publish   = "artifacts/borcovna/dist/public"
  functions = "artifacts/borcovna/netlify/functions"

[build.environment]
  BASE_PATH = "/"
  SMTP_PORT = "465"

[[redirects]]
  from   = "/api/contact"
  to     = "/.netlify/functions/contact"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200